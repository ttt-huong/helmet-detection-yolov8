name: build

on:
  push:
    branches: [main, handoff-repro-checklist]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Python syntax and CLI help
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Check CLI help
        run: |
          for script in scripts/*.py; do
            echo "Checking $script --help"
            python -S "$script" --help
          done

          python -S scripts/analyze_image_conditions.py prepare --help
          python -S scripts/analyze_image_conditions.py aggregate --help
          python -S scripts/continue_v5su.py audit --help
          python -S scripts/continue_v5su.py prepare --help
          python -S scripts/continue_v5su.py resume --help
